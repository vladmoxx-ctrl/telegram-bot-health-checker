[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-bot-health-checker"
version = "0.1.0"
description = "Safe Telegram Bot API health checker for developers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Vladimir Makhov" }
]
keywords = ["telegram", "bot", "health-check", "diagnostics", "webhook"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Monitoring"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/telegram-bot-health-checker"
Issues = "https://github.com/YOUR_USERNAME/telegram-bot-health-checker/issues"

[project.scripts]
telegram-bot-health-checker = "telegram_bot_health_checker.cli:main"
